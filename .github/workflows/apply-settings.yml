---
name: Apply Repository Settings

on:
  push:
    branches: [main]
    paths:
      - '.github/settings.yml'
      - '.github/scripts/apply-settings.js'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: |
          verify - Apply settings then verify they were applied correctly (default)
          apply  - Apply settings.yml to GitHub without verification
          check  - Detect drift: compare settings.yml vs GitHub, fail if different (default on schedule)
        type: choice
        options: [verify, apply, check]
        default: verify

permissions: {}

concurrency:
  group: apply-settings-${{ github.ref }}
  cancel-in-progress: false

env:
  # The secrets context is not available in a job-level `if`.
  HAS_SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN != '' }}

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Labels are managed through the Issues API.
      issues: write
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No YAML parser for the script and no pip install: third-party code in this job could
      # rewrite apply-settings.js before it runs with the administration token.
      - name: Convert settings.yml to JSON
        if: env.HAS_SETTINGS_TOKEN == 'true'
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error::PyYAML is required and was not found. Install it on the runner image; this job will not fetch it." >&2
            exit 1
          }
          python3 -c '
          import json, yaml
          with open(".github/settings.yml") as handle:
              json.dump(yaml.safe_load(handle), open("settings.json", "w"))
          '

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: env.HAS_SETTINGS_TOKEN == 'true'
        env:
          INPUT_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'check' || 'verify') }}
          SETTINGS_JSON: settings.json
        with:
          github-token: ${{ secrets.SETTINGS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/apply-settings.js')
            await script({ github, context, core })

      - name: Explain what was skipped
        if: env.HAS_SETTINGS_TOKEN != 'true'
        run: |
          {
            echo "## Repository settings not applied"
            echo
            echo "\`SETTINGS_TOKEN\` is not configured, so \`.github/settings.yml\` was not applied."
            echo "GITHUB_TOKEN cannot change repository settings, security toggles or rulesets."
            echo
            echo "Add a fine-grained personal access token scoped to this repository with"
            echo "**Administration: read and write** and **Metadata: read**, store it as the"
            echo "\`SETTINGS_TOKEN\` secret, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
