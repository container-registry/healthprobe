---
name: Robot split check

# What: One-off proof that a pull request run can push previews but not releases.
# Fires on: this pull request only; removed before merge.
# Needs: nothing.
# Safe to delete if: always.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
      - name: Preview push allowed, release push refused
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://8gears.container-registry.com" | jq -r '.value')
          echo "::add-mask::${token}"
          printf '%s' "${token}" | oras login 8gears.container-registry.com -u jwt --password-stdin
          echo probe > probe.txt
          oras push 8gears.container-registry.com/8gcr-dev/healthprobe:robot-check probe.txt
          echo "preview push: ok"
          if oras push 8gears.container-registry.com/healthprobe/healthprobe:robot-check probe.txt; then
            echo "::error::a pull request run pushed to the release project"
            exit 1
          fi
          echo "release push from a PR run: refused, as intended"
