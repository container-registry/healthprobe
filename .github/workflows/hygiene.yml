---
name: Hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          . ./versions.env
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin --no-same-owner actionlint

      - name: Run actionlint
        run: actionlint -color

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: |
          set -euo pipefail
          . ./versions.env
          pip install --disable-pip-version-check "yamllint==${YAMLLINT_VERSION}"

      - name: Run yamllint
        run: yamllint --strict .

  repo-lint:
    name: Repository Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Check repository consistency
        run: python3 .github/scripts/repo-lint.py

  zizmor:
    name: Audit Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned zizmor version
        id: pin
        run: echo "version=$(grep '^ZIZMOR_VERSION=' versions.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          inputs: .
          online-audits: true
          persona: regular
          # The action defaults to `latest`; pinned so a new rule release cannot red main.
          version: ${{ steps.pin.outputs.version }}
          # SARIF upload needs Advanced Security, which a private repo lacks; findings still fail the job.
          advanced-security: ${{ github.event.repository.visibility == 'public' }}

  pinned-actions:
    name: Check Action Pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Every action must be pinned to a full SHA with a version comment
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            # `|| [ -n "$line" ]` still handles a final line with no trailing newline
            while IFS= read -r line || [ -n "$line" ]; do
              # Anchored on the YAML key: a bare `*uses:*` glob matches this script's own text.
              printf '%s' "$line" | grep -qE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' || continue
              ref=$(printf '%s' "$line" | sed 's/.*uses:[[:space:]]*//' | awk '{print $1}')
              case "$ref" in ./*) continue ;; esac
              case "$ref" in
                docker://*)
                  if ! printf '%s' "$ref" | grep -qE '@sha256:[a-f0-9]{64}$'; then
                    echo "UNPINNED CONTAINER: $file -> $ref"
                    failed=1
                  fi
                  continue
                  ;;
              esac
              if ! printf '%s' "$line" | grep -qE '@[a-f0-9]{40}[[:space:]]+#[[:space:]]*v[0-9]'; then
                echo "UNPINNED OR MISSING '# vX.Y.Z' COMMENT: $file -> $ref"
                failed=1
              fi
            done < "$file"
          done < <(find .github/workflows .github/actions -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)

          if grep -rnE '(go|pipx?) install [^|;&]*@(latest|main|master)' .github/workflows .github/actions 2>/dev/null; then
            echo "::error::Unpinned tool install in a workflow. Pin the version in versions.env."
            failed=1
          fi

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Pin every 'uses:' to a full 40-character commit SHA followed by a version comment."
            echo "  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1"
            echo "A tag is a moving target: whoever controls the repository can repoint it."
            exit 1
          fi
          echo "All actions are pinned."

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  bootstrap-rehearsal:
    name: Bootstrap Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        run: |
          if [ -f .github/scripts/bootstrap.py ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
            echo "Not a template any more. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install yamllint and actionlint
        if: steps.detect.outputs.template == 'true'
        run: |
          set -euo pipefail
          . ./versions.env
          pip install --disable-pip-version-check "yamllint==${YAMLLINT_VERSION}"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin --no-same-owner actionlint

      - name: Rehearse both adoption paths
        if: steps.detect.outputs.template == 'true'
        run: |
          set -euo pipefail

          # Both filled and blank: rehearsing only blank once shipped leftover marker comments.
          rehearse() {
            lang="$1"
            chart="$2"
            optional="$3"
            if [ "$optional" = "filled" ]; then
              docs="https://docs.example.test"
              slack="https://slack.example.test"
              home="https://example.test"
            else
              docs=""
              slack=""
              home=""
            fi
            work="$(mktemp -d)"
            tar -c --exclude=.git . | tar -x -C "$work"

            (
              cd "$work"
              # actionlint refuses to run outside a repository.
              git init -q .
              python3 .github/scripts/bootstrap.py \
                --org-name acme --repo-name widget \
                --repo-description "A widget service" \
                --copyright-holder "Acme Inc" --copyright-year 2026 \
                --maintainer-name "Ada Lovelace" --maintainer-github ada \
                --security-email security@acme.test \
                --conduct-email conduct@acme.test \
                --homepage-url "$home" --docs-url "$docs" --slack-url "$slack" \
                --lang "$lang" --chart "$chart"

              echo "::group::lang=$lang chart=$chart optional=$optional assertions"

              python3 .github/scripts/repo-lint.py
              yamllint --strict .
              actionlint

              echo "::endgroup::"
            )
            rm -rf "$work"
            echo "lang=$lang chart=$chart optional=$optional rehearsal passed"
          }

          # Four of eight combinations still cover every pack and optional value on and off.
          rehearse go helm filled
          rehearse go none blank
          rehearse none helm blank
          rehearse none none filled

  # The only context safe to require (path-filtered checks never report); add every new job to `needs`.
  required-checks:
    name: required-checks
    if: always()
    needs: [actionlint, yamllint, repo-lint, zizmor, pinned-actions, dependency-review, bootstrap-rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any hygiene job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # `skipped` is fine: dependency-review only runs on pull requests.
          for result in ${RESULTS}; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required hygiene job reported '$result'"; exit 1 ;;
            esac
          done
          echo "All hygiene jobs passed."
