---
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

concurrency:
  # event_name keeps a scheduled run from cancelling a push run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'
      - if: steps.detect.outputs.go == 'true'
        run: task build
      - name: Only the standard library is linked
        if: steps.detect.outputs.go == 'true'
        run: task deps-check
      - name: Binaries are within their size budget
        if: steps.detect.outputs.go == 'true'
        run: task size-check

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'
      - if: steps.detect.outputs.go == 'true'
        run: task test

  lint:
    name: Lint Go
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'
      - if: steps.detect.outputs.go == 'true'
        run: task lint

  license-check:
    name: License Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'
      - if: steps.detect.outputs.go == 'true'
        run: task license-check
      - name: License report
        if: always() && steps.detect.outputs.go == 'true'
        run: task license-report

  vuln-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: write covers comments on PRs; issues: write is not needed.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'

      # Findings do not fail the job, so unfixable advisories cannot keep every run red; only a broken scan does.
      - name: Run govulncheck and render reports
        id: report
        if: steps.detect.outputs.go == 'true'
        run: task vuln-report

      # A failed scan counts zero findings and would delete an accurate comment. Not split into a
      # job without PR code: it runs only for same-repo PRs and needs this job's reports.
      - name: Update pull request comment
        if: >-
          steps.detect.outputs.go == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.report.outputs.scanner-error != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FIXABLE_COUNT: ${{ steps.report.outputs.fixable-count }}
        run: .github/scripts/vulnerability-comment.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.detect.outputs.go == 'true'
        with:
          name: vulnerability-check
          path: vulnerability-check/
          if-no-files-found: warn

      - name: Enforce scanner health
        if: steps.detect.outputs.go == 'true'
        run: task vuln-report:check

  tidy:
    name: Tidy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Not a job-level hashFiles() guard: GITHUB_WORKSPACE does not exist yet there, so it fails open.
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod; the Go pack has been removed. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup
        if: steps.detect.outputs.go == 'true'
      - if: steps.detect.outputs.go == 'true'
        run: task tidy-check

  image:
    name: Image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.detect.outputs.docker == 'true'

      - name: Build both platforms
        if: steps.detect.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          # Build traces can contain signed storage URLs.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Load the native image
        if: steps.detect.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          # Build traces can contain signed storage URLs.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: ci-smoke:latest

      # Without a target the entrypoint exits 1, so the smoke run asks for -version.
      - name: The image must run, and must not run as root
        if: steps.detect.outputs.docker == 'true'
        run: |
          set -euo pipefail
          docker run --rm ci-smoke:latest -version
          user=$(docker inspect --format '{{.Config.User}}' ci-smoke:latest)
          echo "image user: '${user}'"
          case "$user" in
            ''|root|0|0:0) echo "::error::Image runs as root"; exit 1 ;;
          esac

      - uses: ./.github/actions/setup
        if: steps.detect.outputs.docker == 'true'
        with:
          go: "false"

      - name: HEALTHCHECK scenarios under Docker
        if: steps.detect.outputs.docker == 'true'
        run: task e2e:docker

      - name: HEALTHCHECK scenarios under Podman
        if: steps.detect.outputs.docker == 'true'
        run: task e2e:podman
