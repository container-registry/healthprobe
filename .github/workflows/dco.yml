---
name: DCO

# Reads commits over the API, not a checkout: authors resolve to GitHub accounts, so
# `type: Bot` cannot be forged, and no fork code reaches the runner. Exemptions match dco2.

on:
  pull_request:

permissions: {}

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check every commit is signed off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TOTAL_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail

          if [ "${TOTAL_COMMITS}" -gt 250 ]; then
            echo "::error::This pull request has ${TOTAL_COMMITS} commits and the API lists at most 250, so the sign-off check cannot cover it. Split the pull request."
            exit 1
          fi

          # Assigned, not process-substituted: set -e would miss a failed API call and pass the gate.
          # base64 keeps each multi-line message on one line.
          commits=$(gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
            --jq '.[] | select((.parents | length) < 2) | select(.author.type != "Bot") | "\(.sha):\(.commit.message | @base64)"')

          missing=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            sha=${entry%%:*}
            message=$(printf '%s' "${entry#*:}" | base64 -d)
            # Final paragraph only: a sign-off quoted from an upstream body is not this committer's.
            # No checkout, so core.commentChar is unknown and stripspace assumes '#'.
            trailers=$(printf '%s\n' "$message" | git stripspace --strip-comments | awk '/^[[:space:]]*$/ {blank=1; next} {if (blank) {block=""; blank=0} block = block $0 "\n"} END {printf "%s", block}')
            if ! printf '%s' "$trailers" | grep -E "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$" >/dev/null; then
              echo "::error::Missing DCO sign-off: $sha $(printf '%s\n' "$message" | head -1)"
              missing=1
            fi
          done <<< "$commits"

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit needs a Signed-off-by trailer certifying the DCO"
            echo "(https://developercertificate.org/)."
            echo ""
            echo "  Last commit:  git commit --amend -s && git push --force-with-lease"
            echo "  Whole branch: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
