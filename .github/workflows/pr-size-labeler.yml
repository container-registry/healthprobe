---
name: PR Size Labeler

# DO NOT ADD actions/checkout: pull_request_target holds a writable token, and checking
# out the PR head runs fork code with it. repo-lint enforces this.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: size-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@4e3aa0f77f348c8066513d453515316ffa01a607  # v1.11.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 100
          m_label: 'size/M'
          m_max_size: 500
          l_label: 'size/L'
          l_max_size: 1000
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: |
            This PR is quite large. Consider breaking it into smaller PRs for easier review.
          files_to_ignore: |
            "package-lock.json"
            "go.sum"
            "*.lock"
            "*.snap"
