---
name: PR Preview Image

# Not reusing publish-image.yml: it accepts only a release tag, and a preview must not weaken that.
# No `paths` filter: it sees only a stack's top slice, so the `changes` job diffs the whole stack.

on:
  pull_request:
    # `opened` precedes stack linking and never carries pull_request.stack; linking fires `stacked`.
    types: [opened, synchronize, reopened, stacked]
    branches: [main]

permissions: {}

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check image inputs
    # Only the top of a native stack builds: its head already contains every lower PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      matched: ${{ steps.diff.outputs.matched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the diff below spans the whole stack
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the stack base
        id: diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || '' }}
          STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
          EVENT_ACTION: ${{ github.event.action }}
          # Only what the Dockerfile consumes; extend when the image copies more.
          IMAGE_INPUTS: |
            ^[^/]+\.go$
            ^cmd/
            ^internal/
            ^pkg/
            ^go\.(mod|sum)$
            ^Dockerfile$
            ^versions\.env$
            ^\.github/workflows/pr-image\.yml$
        run: |
          set -euo pipefail
          echo "event=${EVENT_ACTION} stack=${STACK_NUMBER:-none}"
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${STACK_BASE_SHA:-${PR_BASE_SHA}}"
          # --no-renames: otherwise a rename out of the allowlist hides that an image input went away.
          changed="$(git diff --name-only --no-renames "${base}...${HEAD_SHA}")"
          if matched="$(grep -Ef <(printf '%s' "${IMAGE_INPUTS}") <<<"${changed}")"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            {
              echo "matched<<MATCHED_EOF"
              printf '%s\n' "${matched}"
              echo "MATCHED_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No image input changed between ${base} and ${HEAD_SHA}. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  preview-image:
    name: Publish preview image
    needs: [changes]
    if: >-
      needs.changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The head, not the merge commit, so a moving main cannot change the commented digest.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve image name
        id: target
        env:
          REGISTRY: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
          IMAGE: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}/${{ vars.PR_REGISTRY_PROJECT || '8gcr-dev' }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Mint an OIDC token for Harbor
        id: harbor-oidc
        env:
          AUDIENCE: https://${{ steps.target.outputs.registry }}
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.target.outputs.registry }}
          username: jwt
          password: ${{ steps.harbor-oidc.outputs.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.target.outputs.image }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          provenance: false  # a preview carries a signature and an SBOM, not release provenance
          sbom: false        # replaced by the syft attestation below

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      # Sign and attest by digest, never by tag: pr-<N> is repointed on every push.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

  pr-comment:
    name: Comment preview image ref
    needs: [changes, preview-image]
    # Runs when nothing was published too, so an earlier reference gets marked stale.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      IMAGE: ${{ needs.preview-image.outputs.image }}
      DIGEST: ${{ needs.preview-image.outputs.digest }}
      PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
      MATCHED: ${{ needs.changes.outputs.matched }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHANGES_BUILD: ${{ needs.changes.outputs.build }}
      BUILD_RESULT: ${{ needs.preview-image.result }}
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          MARKER: "<!-- pr-preview-image -->"
          SIBLING_MARKER: "<!-- pr-preview-chart -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const siblingMarker = process.env.SIBLING_MARKER;
            const staleStart = '<!-- preview:stale-start -->';
            const staleEnd = '<!-- preview:stale-end -->';
            const stackNumber = process.env.STACK_NUMBER;
            const short = process.env.HEAD_SHA.slice(0, 7);
            const repository = process.env.GITHUB_REPOSITORY;
            const issueNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const { IMAGE, DIGEST, PREVIEW_TAG } = process.env;
            const ref = `${IMAGE}@${DIGEST}`;
            // Fulcio records the workflow at the ref it ran from, refs/pull/N/merge.
            const identity = `^https://github\\.com/${owner}/${repo}/\\.github/workflows/pr-image\\.yml@`;

            const stack = stackNumber
              ? await github.request('GET /repos/{owner}/{repo}/stacks/{stack_number}', {
                  owner, repo, stack_number: Number(stackNumber),
                }).then(response => response.data).catch(error => {
                  core.warning(`Could not list stack #${stackNumber}: ${error.message}`);
                  return null;
                })
              : null;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));

            const post = async body => {
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            };

            const withoutNotice = body => {
              const kept = [];
              let inNotice = false;
              for (const line of body.split('\n')) {
                if (line === staleStart) { inNotice = true; continue; }
                if (line === staleEnd) { inNotice = false; continue; }
                // `:stale` also matches the first implementation's inline marker.
                if (!inNotice && line !== marker && !/^<!--[^>]*:stale/.test(line)) kept.push(line);
              }
              return kept.join('\n').trim();
            };

            if (process.env.BUILD_RESULT !== 'success') {
              if (!existing) return;
              let reason;
              if (process.env.CHANGES_RESULT === 'skipped' && stackNumber) {
                const top = stack?.pull_requests?.[stack.pull_requests.length - 1];
                reason = `this PR is not the top of stack #${stackNumber}` +
                  (top ? `, so the stack's preview image is published on #${top.number}` : '');
              } else if (process.env.CHANGES_RESULT !== 'success') {
                reason = `the image input check for \`${short}\` did not complete (${process.env.CHANGES_RESULT})`;
              } else if (process.env.CHANGES_BUILD !== 'true') {
                reason = `no image input changed between the base and \`${short}\``;
              } else {
                reason = `the preview image build for \`${short}\` did not succeed (${process.env.BUILD_RESULT}). ` +
                  'That build may already have repointed the preview reference, so trust the digest below rather than the tag';
              }
              await post([
                marker,
                staleStart,
                '> [!WARNING]',
                `> **Outdated:** ${reason}. What follows is from an earlier revision of this PR.`,
                staleEnd,
                '',
                withoutNotice(existing.body),
              ].join('\n'));
              return;
            }

            const matched = (process.env.MATCHED || '').split('\n').map(line => line.trim()).filter(Boolean);
            const shown = matched.slice(0, 5).map(path => `\`${path}\``).join(', ');
            const more = matched.length > 5 ? ` and ${matched.length - 5} more` : '';

            const stackSection = [];
            if (stackNumber) {
              stackSection.push('', `This PR is the top of stack #${stackNumber}, so the image comes from a head that contains every PR in it:`, '');
              stackSection.push(...(stack?.pull_requests?.length
                ? stack.pull_requests.map((pr, index) => `${index + 1}. #${pr.number} ${pr.title}`)
                : ['(see the stack view on this PR)']));
              if (matched.length) {
                stackSection.push('', `Built because ${shown}${more} changed somewhere in the stack.`);
              }
              stackSection.push('', 'Lower PRs publish nothing of their own; push a fix there, then `gh stack rebase && gh stack push` to rebuild this one.');
            }

            const sibling = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(siblingMarker));
            const siblingSection = sibling
              ? ['', sibling.body.includes(staleStart)
                  ? `A preview chart for this pull request has a comment, but it is currently marked outdated: ${sibling.html_url}`
                  : `A preview chart for this pull request is published too, and its comment carries the command that installs it against this image: ${sibling.html_url}`]
              : [];

            const body = [
              marker,
              `A preview image for this pull request is available, built from \`${short}\`:`,
              '',
              '```',
              `${IMAGE}:${PREVIEW_TAG}`,
              '```',
              '',
              `Digest: \`${DIGEST}\``,
              ...stackSection,
              ...siblingSection,
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'SBOM attestation:',
              '',
              '```bash',
              `cosign verify-attestation --type spdxjson ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
            ].join('\n');

            await post(body);
