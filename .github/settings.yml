repository:
  # Never add `visibility` (would publish a private derived repo, irreversibly)
  # or `is_template` (every derived repo would become a template).
  description: "Static, dependency-free HTTP health probe for container HEALTHCHECKs in scratch and distroless images"
  homepage: ""
  topics: []
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  # Enabling also needs the Discussions link back in ISSUE_TEMPLATE/config.yml
  # and question.yml deleted.
  has_discussions: false
  default_branch: main
  allow_forking: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  allow_auto_merge: false
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  # Not PR_BODY: the PR body has no Signed-off-by trailer, so main would lose DCO sign-offs.
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  web_commit_signoff_required: false

# can_approve_pull_request_reviews lets release-please open its release PR.
actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: true

labels:
  blocked:
    color: e11d21
    description: Blocked by another issue or PR
  breaking-change:
    color: b60205
    description: Breaking change requiring major version bump
  bug:
    color: d73a4a
    description: Something isn't working
  component/ci:
    color: c5def5
    description: CI/CD related
  component/config:
    color: c5def5
    description: Configuration related
  dependencies:
    color: 0366d6
    description: Dependencies update
  do-not-merge:
    color: e11d21
    description: PR should not be merged
  documentation:
    color: 0075ca
    description: Improvements or additions to documentation
  tests:
    color: bfd4f2
    description: Test coverage or test infrastructure
  enhancement:
    color: a2eeef
    description: New feature or request
  good first issue:
    color: 7057ff
    description: Good for newcomers
  help wanted:
    color: "008672"
    description: Extra attention is needed
  mentor-available:
    color: 0e8a16
    description: A mentor is available to help with this issue
  needs-info:
    color: ffffff
    description: Additional information needed
  needs-rebase:
    color: e11d21
    description: PR needs to be rebased
  needs-triage:
    color: ededed
    description: Needs initial triage by maintainers
  proposal:
    color: fbca04
    description: Architectural proposal requiring discussion
  question:
    color: d876e3
    description: Further information is requested
  security:
    color: d93f0b
    description: Security-related issue or fix
  size/L:
    color: A14C05
    description: Large PR (500-1000 lines)
  size/M:
    color: 7F7203
    description: Medium PR (100-500 lines)
  size/S:
    color: 5D9801
    description: Small PR (10-100 lines)
  size/XL:
    color: C32607
    description: Extra large PR (> 1000 lines)
  size/XS:
    color: 3CBF00
    description: Extra small PR (< 10 lines)
  wip:
    color: fef2c0
    description: Work in progress

  chore:
    color: fef2c0
    description: Maintenance task
  perf:
    color: f9d0c4
    description: Performance improvement
  refactor:
    color: d4c5f9
    description: Code refactoring
  test:
    color: bfdadc
    description: Test-related changes
  build:
    color: c2e0c6
    description: Build system changes

security:
  # On a private repository both require GitHub Advanced Security.
  secret_scanning:
    status: enabled
  secret_scanning_push_protection:
    status: enabled
  # Security updates silently do nothing without the alerts.
  vulnerability_alerts: enabled
  dependabot_security_updates:
    status: enabled
  # SECURITY.md and the issue chooser link to the advisory form, which errors without this.
  private_vulnerability_reporting: enabled

code_scanning:
  # Keep off: codeql.yml is the advanced setup, and running both duplicates every alert.
  state: not-configured
  query_suite: default
  languages: [actions, go]

rulesets:
  protect-default-branch:
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          # A solo maintainer cannot approve their own PR; raise to 1 once there are two.
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          allowed_merge_methods: [squash]
      # Not required until release-please uses a GitHub App token: its bot-pushed
      # release PR runs wait for manual approval. Require only `required-checks`.
      # - type: required_status_checks
      #   parameters:
      #     strict_required_status_checks_policy: true
      #     do_not_enforce_on_create: false
      #     required_status_checks:
