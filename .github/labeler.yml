documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'

component/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'Taskfile.yml'
          - 'taskfile/**'
          - 'lefthook.yml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'go.mod'
          - 'go.sum'
          - 'package.json'
          - 'package-lock.json'
          - 'requirements.txt'
          - 'Cargo.toml'
          - 'Cargo.lock'

# Narrow on purpose: a root '*.yml' glob would label nearly every pull request.
component/config:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/**'
          - 'configs/**'
          - '.editorconfig'
          - '.yamllint'
          - 'versions.env'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - '**/*.test.js'
          - '**/*.test.ts'
          - '**/*.spec.js'
          - '**/*.spec.ts'
          - 'tests/**/*'
